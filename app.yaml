# Runtime for Google App Engine. The production deployment of electrotallinn.ee
# is done with PM2 (see deploy.sh / ecosystem.config.js and README.md).
# Node version must match .nvmrc / package.json engines (Dart Sass + webpack 4).
runtime: nodejs24
service: nuxt

instance_class: F1

handlers:
  - url: /_nuxt
    static_dir: .nuxt/dist/client
    expiration: 4d 5h
    secure: always

  - url: /(.*\.(gif|png|jpg|ico|txt))$
    static_files: static/\1
    upload: static/.*\.(gif|png|jpg|ico|txt)$
    secure: always

  - url: /.*
    script: auto
    secure: always